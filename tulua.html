<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subdirectiva Tuluá - SINUT UNP</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      .galeria-container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 20px;
        text-align: center;
      }

      .galeria-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        margin-top: 30px;
      }

      .galeria-item {
        overflow: hidden;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        background-color: #fff;
      }

      .galeria-item img {
        width: 100%;
        height: 240px;
        object-fit: cover;
        display: block;
        transition: transform 0.3s ease;
      }

      .galeria-item img:hover {
        transform: scale(1.05);
      }

      .btn-volver {
        display: inline-block;
        margin-bottom: 20px;
        padding: 10px 20px;
        background-color: #3b1e08;
        color: #fff;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="galeria-container">
      <a href="index.html" class="btn-volver"
        ><i class="fa-solid fa-arrow-left"></i> Volver al Inicio</a
      >

      <h1>Subdirectiva SINUT UNP Tuluá</h1>
      <p>
        Registro fotográfico del trabajo, acompañamiento y actividades de
        protección en el municipio de Tuluá.
      </p>

      <!-- GALERÍA DE IMÁGENES TULUÁ -->
      <div class="galeria-grid">
        <div class="galeria-item">
          <img src="assets/img/tulua/t1.jpg" alt="Actividad Tuluá 1" />
        </div>
        <div class="galeria-item">
          <img src="assets/img/tulua/t6.jpg" alt="Actividad Tuluá 2" />
        </div>
        <div class="galeria-item">
          <img src="assets/img/tulua/tr.jpg" alt="Actividad Tuluá 3" />
        </div>
      </div>
    </div>
  </body>
</html>
