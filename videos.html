<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video del Día | SINUT UNP</title>
    
    <!-- Enlace al Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/img/favicon.png" />
    
    <!-- Hoja de estilos principal del proyecto -->
    <link rel="stylesheet" href="./css/styles.css?v=2.0">

    <style>
        /* ==========================================
           ESTILOS PÁGINA VIDEO DIARIO (AMPLIADA Y AMARILLO CLARO)
           ========================================== */
        body {
            background-color: #fff8e1; /* Fondo amarillo claro institucional */
            color: #2b1704;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .contenedor-video-page {
            width: 95%;
            max-width: 1400px; /* Mucho más ancha para cubrir gran parte de la pantalla */
            margin: 20px auto;
            padding: 40px 30px;
            background-color: rgba(43, 23, 4, 0.9); /* Tarjeta contenedora café elegante */
            border: 2px solid #ffcc00;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.5);
        }

        .contenedor-video-page h1 {
            color: #ffcc00;
            font-size: 3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 900;
            text-shadow: 0 3px 10px rgba(0,0,0,0.8);
        }

        .contenedor-video-page .subtitulo {
            color: #ffffff;
            font-size: 1.25rem;
            margin-bottom: 30px;
            font-weight: 500;
        }

        /* REPRODUCTOR DE VIDEO HORIZONTAL 16:9 AMPLIADO */
        .contenedor-video-horizontal {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Relación de aspecto panorámica 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 14px;
            background-color: #000000;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 204, 0, 0.4);
            margin-bottom: 35px;
        }

        .contenedor-video-horizontal video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            object-fit: contain; /* Conserva todo el video completo sin deformar ni recortar */
        }

        /* BOTÓN DE RETORNO AL INICIO (CAFÉ CON TEXTO BLANCO/AMARILLO) */
        .btn-regresar {
            display: inline-block;
            width: 100%;
            max-width: 400px;
            padding: 16px 30px;
            background-color: #3b1e08; /* Color café corporativo */
            color: #ffcc00; /* Texto amarillo claro corporativo */
            font-weight: 900;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.2rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid #ffcc00;
        }

        .btn-regresar:hover {
            background-color: #ffcc00;
            color: #2b1704;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <main class="contenedor-video-page">
        <h1>Video del Día</h1>
        <p class="subtitulo">¡Hoy es un gran día para seguir adelante! <br>
Con unidad, compromiso y valentía seguimos nuestra lucha por la defensa de los derechos laborales de los hombres y mujeres de protección.
¡Juntos somos más fuertes! ¡SINUT UNP, siempre firme en la lucha!</p>

        <!-- Contenedor del reproductor de video horizontal (16:9) ampliado -->
        <div class="contenedor-video-horizontal">
            <video controls poster="./assets/img/logo.png">
                <source src="./assets/videos/dere.mp4" type="video/mp4">
                Tu navegador no soporta el formato de video reproducido.
            </video>
        </div>

        <!-- Botón para regresar al inicio -->
        <a href="./index.html" class="btn-regresar">← Volver al Inicio</a>
    </main>

</body>
</html>
