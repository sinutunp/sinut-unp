<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Video - SINUT UNP</title>
    <!-- Vinculamos tu hoja de estilos principal con la versión actualizada -->
    <link rel="stylesheet" href="styles.css?v=1.1">
</head>
<body>

    <!-- Encabezado / Barra de Navegación -->
    <header class="header" style="background-color: #2b180a; padding: 15px 0;">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="index.html" class="logo">
                <img src="assets/img/logo.png" alt="SINUT UNP" style="max-height: 50px;">
            </a>
            <nav class="nav">
                <a href="index.html" style="color: #fff; text-decoration: none; font-weight: bold;">INICIO</a>
            </nav>
        </div>
    </header>

    <!-- Contenido Principal del Video -->
    <main class="container" style="max-width: 900px; margin: 40px auto; padding: 20px; text-align: center;">
        
        <span style="color: #c9a037; font-weight: bold; text-transform: uppercase;">SECCIÓN MULTIMEDIA</span>
        <h1 style="color: #3b1e08; font-size: 2.2rem; margin-top: 10px; margin-bottom: 25px;">
            Video Institucional - SINUT UNP
        </h1>

        <!-- OPCIÓN A: Si tienes el archivo de video .mp4 guardado en la carpeta assets/video/ -->
        <div class="video-container" style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); background-color: #000; margin-bottom: 25px;">
            <video controls style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 12px;">
                <source src="assets/videos/unp.mp4" type="video/mp4">
                Tu navegador no soporta la reproducción de videos en HTML5.
            </video>
        </div>

        <!-- OPCIÓN B: Si vas a usar un video de YouTube (Si usas la Opción A, borra o comenta esta parte) -->
        <!--
        <div class="video-container" style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); margin-bottom: 25px;">
            <iframe 
                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;"
                src="https://www.youtube.com/embed/TU_CODIGO_DE_YOUTUBE" 
                title="Video SINUT UNP" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>
        -->

        <!-- Descripción o contexto del video -->
        <p style="font-size: 1.1rem; line-height: 1.8; color: #444; margin-bottom: 30px; text-align: left;">
            Conoce los detalles del encuentro de nuestro presidente nacional, Gustavo Delgado, con el director de la Unidad Nacional de Protección, doctor Didier Blanco.
        </p>

        <!-- Botón para regresar -->
        <div style="text-align: center; margin-top: 30px;">
            <a href="index.html" class="btn btn-brown" style="text-decoration: none; padding: 12px 25px; display: inline-block;">
                &larr; Volver a la página principal
            </a>
        </div>

    </main>

    <!-- Pie de página -->
    <footer style="background-color: #2b180a; color: #fff; text-align: center; padding: 20px; margin-top: 50px;">
        <p>&copy; SINUT UNP - Todos los derechos reservados.</p>
    </footer>

</body>
</html>
